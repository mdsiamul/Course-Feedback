<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoCourse Feedback</title>
  <style>
    :root {
      --bg-1: #fff9f4;
      --bg-2: #ffe7dd;
      --card: #ffffff;
      --text: #2c1b16;
      --muted: #7f6158;
      --line: #f0d5cb;
      --accent-1: #ff7a59;
      --accent-2: #f04a4a;
      --accent-3: #ca3333;
      --status-bg: #fffaf7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 336px;
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      background:
        radial-gradient(140px 110px at 100% 0%, #ffd5c9 0%, rgba(255, 213, 201, 0) 72%),
        radial-gradient(160px 140px at 0% 100%, #ffece4 0%, rgba(255, 236, 228, 0) 70%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      padding: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      box-shadow:
        0 14px 24px rgba(171, 90, 64, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.92);
      animation: popIn 180ms ease-out;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 22px;
      letter-spacing: 0.25px;
      margin: 0;
      color: #7c2822;
      line-height: 1.08;
    }

    .subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-top: 5px;
      margin-bottom: 14px;
    }

    .version {
      font-size: 11px;
      color: #9a6a5e;
      margin-top: 12px;
      margin-bottom: 6px;
      text-align: center;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 13px;
      padding: 12px 14px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.2px;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2) 55%, var(--accent-3));
      box-shadow: 0 8px 14px rgba(202, 51, 51, 0.3);
      transition: transform 0.16s ease, box-shadow 0.16s ease, opacity 0.12s ease, filter 0.16s ease;
      will-change: transform;
    }

    button:hover {
      transform: translateY(-1px) scale(1.004);
      filter: saturate(1.06);
      box-shadow: 0 10px 16px rgba(202, 51, 51, 0.35);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.72;
      cursor: wait;
      transform: none;
      filter: none;
    }

    .status {
      margin-top: 10px;
      min-height: 36px;
      font-size: 12px;
      line-height: 1.4;
      color: #6e3026;
      background: var(--status-bg);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 9px;
    }

    .footer {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      font-size: 11px;
      color: #886258;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>AutoCourse Feedback</h1>
    <div class="subtitle">One click to open, fill, and auto-submit forms</div>

    <div class="actions">
      <button id="feedbackBtn" type="button">Feedback and Submit</button>
    </div>

    <div id="status" class="status"></div>

    <div id="versionText" class="version">Version</div>
    <div class="footer">Developed by: Md Siamul Islam (230032201 - TVE)</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
